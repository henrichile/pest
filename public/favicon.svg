<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cuerpo del insecto -->
  <ellipse cx="50" cy="50" rx="35" ry="25" fill="url(#grad)"/>
  <!-- Cabeza -->
  <ellipse cx="50" cy="35" rx="20" ry="15" fill="url(#grad)"/>
  <!-- Antenas -->
  <path d="M 40 25 Q 35 15 30 10" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 60 25 Q 65 15 70 10" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="10" r="2" fill="#16a34a"/>
  <circle cx="70" cy="10" r="2" fill="#16a34a"/>
  <!-- Ojos -->
  <circle cx="45" cy="35" r="4" fill="#111"/>
  <circle cx="55" cy="35" r="4" fill="#111"/>
  <!-- Patas -->
  <path d="M 25 50 Q 15 55 10 60" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 30 60 Q 20 65 15 70" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 35 70 Q 25 75 20 80" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 75 50 Q 85 55 90 60" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 70 60 Q 80 65 85 70" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 65 70 Q 75 75 80 80" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Línea divisoria del cuerpo -->
  <path d="M 30 50 Q 50 55 70 50" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
